# Nginx sirve el frontend compilado y entrega la API a php-fpm.
#
# Todo por el mismo origen: no hay CORS que configurar, ni preflight, ni
# problemas de cookies entre dominios. Los desajustes de CORS que tuvimos en
# desarrollo desaparecen solos con esta disposición.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;   # los escaneos PDF llegan hasta 10 MB

    # Compresión: en una red institucional con enlaces lentos, el paquete de
    # Angular es lo que más tarda.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;

        # Los reportes con muchas filas pueden tardar.
        fastcgi_read_timeout 120s;
    }

    # --- Archivos del frontend --------------------------------------------
    # Los recursos con huella en el nombre nunca cambian: se cachean un año.
    location ~* \.(js|css|woff2|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular maneja sus rutas: cualquier ruta desconocida devuelve index.html
    # para que el enrutador del navegador la resuelva. Sin esto, recargar
    # estando en /salidas/3 da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras mínimas de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}
