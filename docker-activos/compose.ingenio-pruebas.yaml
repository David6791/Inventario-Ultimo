# =============================================================================
# Réplica de «ingenio» para probar cambios antes de pasarlos a producción.
#
#   docker compose -f compose.ingenio-pruebas.yaml --env-file .env.ingenio-pruebas up -d --build
#   docker compose -f compose.ingenio-pruebas.yaml --env-file .env.ingenio-pruebas --profile build run --rm node
#   scripts\copiar-ingenio-a-pruebas.cmd      (copia la base de producción a la réplica)
#
# Igual que compose.ingenio.yaml, pero aislada de producción:
#   - Proyecto, contenedores, red y volúmenes propios (ingenio-pruebas-*).
#   - Su PROPIA base (volumen ingenio-pruebas-pgdata): una copia de la de
#     producción hecha con el script; lo que se pruebe aquí no toca ingenio.
#   - Debe correr desde OTRA carpeta del código (p. ej. D:\IngenioPruebas):
#     ingenio monta D:\Activos\backend, y aplicar un parche ahí cambiaría
#     producción en el acto.
#   - La base no publica puerto (se entra con Adminer o docker exec).
#   - Sin túnel de Cloudflare: se entra por la red de la oficina
#     (http://IP-de-esta-PC:8091), también desde el celular.
# =============================================================================

name: ingenio-pruebas

services:

  db:
    image: postgres:16-alpine
    container_name: ingenio-pruebas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/La_Paz
    # Sin puerto publicado: Windows reserva rangos enteros de puertos (Hyper-V,
    # WSL) y la réplica no lo necesita. Para entrar a la base: Adminer, o
    #   docker exec -it ingenio-pruebas-db psql -U <usuario> -d <base>
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [pruebas]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ingenio-pruebas-app
    container_name: ingenio-pruebas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${URL_PRUEBAS}
      FRONTEND_URL: ${URL_PRUEBAS}
      URL_VERIFICACION: ${URL_PRUEBAS}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MIGRAR_AL_INICIAR: "true"
      SEMBRAR_AL_INICIAR: "false"
      # Lector de boletas con Claude (opcional): sin clave, el sistema ofrece solo manual y Tesseract.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELO: ${ANTHROPIC_MODELO:-claude-sonnet-5-5}
      ANTHROPIC_LADO_MAX: ${ANTHROPIC_LADO_MAX:-1100}
    volumes:
      - ../backend:/var/www/backend
      - vendor:/var/www/backend/vendor
    networks: [pruebas]

  web:
    image: nginx:1.27-alpine
    container_name: ingenio-pruebas-web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${PUERTO_WEB:-8091}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend:/var/www/backend:ro
      - ../frontend/dist/frontend/browser:/var/www/frontend:ro
    networks: [pruebas]

  adminer:
    image: adminer:4-standalone
    container_name: ingenio-pruebas-adminer
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:${PUERTO_ADMINER:-8083}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [pruebas]

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ingenio-pruebas-node
    profiles: [build]
    working_dir: /app
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx ng build --configuration production"
    networks: [pruebas]

volumes:
  pgdata:
    name: ingenio-pruebas-pgdata
  vendor:
  node_modules:

networks:
  pruebas:
    name: ingenio-pruebas-net
