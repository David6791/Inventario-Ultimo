# =============================================================================
# Sistema en producción: proyecto «ingenio».
#
#   docker compose -f compose.ingenio.yaml --env-file .env.ingenio up -d --build
#   docker compose -f compose.ingenio.yaml --env-file .env.ingenio --profile build run --rm node
#
# Diferencias con compose.yaml (la demo):
#   - Nombre de proyecto y contenedores propios: ingenio-db, ingenio-app,
#     ingenio-web, ingenio-tunel, ingenio-adminer.
#   - Red propia: no comparte DNS con la demo (dos servicios «db» en la misma
#     red harían que Laravel hable a veces con la base equivocada).
#   - La base REUTILIZA el volumen existente (VOLUMEN_DB): no arranca vacía.
#   - La base y Adminer escuchan solo en 127.0.0.1: no se ven desde la red.
#   - Cloudflare Tunnel publica el sistema en el dominio sin abrir puertos
#     en el router. El túnel apunta solo a nginx.
#   - No siembra datos de ejemplo al arrancar.
# =============================================================================

name: ingenio

services:

  db:
    image: postgres:16-alpine
    container_name: ingenio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${PUERTO_DB:-5435}:5432"     # solo desde esta PC (DBeaver, pgAdmin)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ingenio]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ingenio-app
    container_name: ingenio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${URL_PUBLICA}
      FRONTEND_URL: ${URL_PUBLICA}
      URL_VERIFICACION: ${URL_PUBLICA}          # el QR de los rótulos de lote
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MIGRAR_AL_INICIAR: "true"
      SEMBRAR_AL_INICIAR: "false"               # en producción los seeders se corren a mano
    volumes:
      - ../backend:/var/www/backend
      - vendor:/var/www/backend/vendor
    networks: [ingenio]

  web:
    image: nginx:1.27-alpine
    container_name: ingenio-web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${PUERTO_WEB:-8090}:80"                # acceso por la red de la oficina
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend:/var/www/backend:ro
      - ../frontend/dist/frontend/browser:/var/www/frontend:ro
    networks: [ingenio]

  # Cloudflare Tunnel: conexión de salida hacia Cloudflare; no abre puertos.
  tunel:
    image: cloudflare/cloudflared:2026.10.1
    container_name: ingenio-tunel
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [ingenio]

  adminer:
    image: adminer:4-standalone
    container_name: ingenio-adminer
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:${PUERTO_ADMINER:-8082}:8080"  # solo desde esta PC
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [ingenio]

  # Compila el frontend y termina.
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ingenio-node
    profiles: [build]
    working_dir: /app
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx ng build --configuration production"
    networks: [ingenio]

volumes:
  # Volumen de la base que ya existe (el de activos-pruebas). Verificar el
  # nombre con «docker volume ls» antes del primer arranque.
  pgdata:
    external: true
    name: ${VOLUMEN_DB}
  vendor:
  node_modules:

networks:
  ingenio:
    name: ingenio-net
