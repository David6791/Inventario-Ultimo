server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # No anunciar la versión de nginx al compartir en red.
    server_tokens off;

    # ---- Frontend Angular (build de producción) ----
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;   # rutas del router quedan del lado del cliente
    }

    # ---- API Laravel ----
    # El frontend llama a /api de forma relativa, así que la misma imagen
    # funciona en localhost, en 192.168.x.x o detrás de un dominio, sin
    # recompilar y sin CORS.
    location /api {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        root /var/www/backend/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 300;
    }

    # Cualquier otro .php queda fuera de alcance.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
        # ---- Archivos subidos (fotos de activos) ----
    # Sin este bloque, /storage cae en el location / de Angular y nginx
    # devuelve index.html en vez de la imagen: el navegador recibe HTML
    # donde espera un JPEG y no muestra nada, sin error visible.
    location /storage {
        root /var/www/backend/public;
        try_files $uri =404;

        # Las fotos no cambian: una vez descargadas, no vale la pena volver
        # a pedirlas. Importa sobre la conexión de un acopio remoto.
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/activos-access.log;
    error_log  /var/log/nginx/activos-error.log warn;
}
