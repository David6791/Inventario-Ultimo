# =============================================================================
# Sistema de Inventarios — entorno de desarrollo
#
#   inventarios-db      PostgreSQL 16      :5432
#   inventarios-api     PHP 8.3-FPM        (interno)
#   inventarios-nginx   Nginx              :8000  -> API Laravel
#   inventarios-web     Node 20 + Angular  :4200  -> frontend
#
# Los tres primeros bastan para el backend. El de Angular es opcional: si
# preferís correr `ng serve` en tu máquina, comentá el servicio `web`.
# =============================================================================

name: inventarios

services:

  db:
    image: postgres:16-alpine
    container_name: inventarios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventarios
      POSTGRES_USER: inventarios
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventarios}
      # Sin esto PostgreSQL usa la collation del sistema y los ORDER BY con
      # tildes salen en un orden raro para nombres en español.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Expuesto para que puedas conectarte con DBeaver o pgAdmin desde el host.
      - "5433:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      # Los demás servicios esperan a que responda, no solo a que arranque.
      test: ["CMD-SHELL", "pg_isready -U inventarios -d inventarios"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]
    command: postgres -c timezone=America/La_Paz

  api:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: inventarios-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # vendor/ se comparte con el host a propósito: así el editor ve las
      # clases de Laravel y funciona el autocompletado. Un volumen nombrado acá
      # taparía el vendor/ que creó composer y artisan no encontraría autoload.
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    environment:
      - TZ=America/La_Paz

  nginx:
    image: nginx:1.27-alpine
    container_name: inventarios-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [interna]

  web:
    image: node:20-alpine
    container_name: inventarios-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
    # --poll es obligatorio en Windows y macOS: los eventos del sistema de
    # archivos no cruzan el límite del contenedor y sin esto no recarga al guardar.
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 5000"
    networks: [interna]

volumes:
  datos-db:

networks:
  interna:
    driver: bridge
